version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      framework:
        dependency-type: production
        patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - minor
          - patch
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - minor
          - patch
      ui-components:
        dependency-type: production
        patterns:
          - "@radix-ui/*"
          - "lucide-react"
          - "class-variance-authority"
          - "tailwind-merge"
        update-types:
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "prisma"
          - "@prisma/*"
          - "@radix-ui/*"
          - "lucide-react"
          - "class-variance-authority"
          - "tailwind-merge"
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
