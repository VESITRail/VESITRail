# GitHub Actions PR Labeler configuration
# Docs: https://github.com/actions/labeler

changed-files-labels-limit: 10
max-files-changed: 250

# Branch-based labels
feature:
  - head-branch: ["^feature/", "^feat/"]

bug:
  - head-branch: ["^fix/", "^bugfix/", "^hotfix/"]

performance:
  - head-branch: ["^perf/"]

# Branch or changed-file labels
documentation:
  - any:
      - head-branch: ["^docs/", "^doc/"]
      - changed-files:
          - any-glob-to-any-file:
              - "docs/**"
              - "*.md"
              - ".github/**/*.md"
              - "LICENSE"

dependencies:
  - any:
      - head-branch: ["^deps/", "^dependencies/", "^dependabot/", "^renovate/"]
      - changed-files:
          - any-glob-to-any-file:
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
              - ".github/dependabot.yml"
              - "tsconfig.json"
              - "eslint.config.mjs"
              - "next.config.ts"
              - "instrumentation-client.ts"
              - ".prettierrc"
              - ".prettierignore"
              - ".husky/**"
              - ".releaserc.json"
              - ".gitignore"
              - ".env.example"
              - ".env.test"

testing:
  - any:
      - head-branch: ["^test/", "^tests/"]
      - changed-files:
          - any-glob-to-any-file:
              - "tests/**"
              - "vitest.config.ts"

# Changed-file path labels
backend:
  - changed-files:
      - any-glob-to-any-file:
          - "src/actions/**"
          - "src/app/api/**"
          - "src/lib/**"
          - "src/proxy.ts"
          - "src/types/**"
          - "prisma/**"
          - "prisma.config.ts"
          - "scripts/**"

